<!DOCTYPE html><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&family=DM+Mono:wght@400;500&display=swap">
<style>*{box-sizing:border-box}html,body{margin:0}
:root{--bg:#eef0f3;--paper:#fbfcfd;--ink:#11161f;--blue:#1950cc;--muted:#3e434b}
.d{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;letter-spacing:-.055em;font-variation-settings:"opsz" 96}
.m{font-family:"DM Mono",monospace}
.sq{display:block;background:var(--blue)}
.route{position:relative;height:14px}
.route .l{position:absolute;left:0;right:0;top:6px;height:2px;background:var(--ink)}
.route .n{position:absolute;inset:0;display:flex;justify-content:space-between}
.route .n span{width:14px;height:14px;background:var(--paper);border:2px solid var(--ink);border-radius:50%}
.route .n span.g{border-radius:0;border-color:var(--blue);transform:rotate(45deg)}
.labels{display:flex;justify-content:space-between;margin-top:10px;color:var(--muted)}
.labels span:nth-child(4){color:var(--blue)}
</style>
<style>body{width:1200px;height:240px;overflow:hidden;background:transparent;display:flex;align-items:center;padding-left:40px;gap:36px}
.w{font-size:150px;line-height:1;color:var(--ink)}.w b{color:var(--blue)}</style>
<body><i class="sq" style="width:110px;height:110px"></i><span class="w d">Keep Shipping<b>.</b></span></body>
